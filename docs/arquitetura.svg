<text x="56" y="1440" font-size="14" fill="#333">guardrail</text>
<rect x="151" y="1426" width="18" height="18" rx="4" fill="#EEF0FF" stroke="#4B57B8" stroke-width="2"/>
<text x="177" y="1440" font-size="14" fill="#333">contexto</text>
<rect x="263" y="1426" width="18" height="18" rx="4" fill="#E3F0FB" stroke="#1F6FB2" stroke-width="2"/>
