<rect x="330" y="1426" width="18" height="18" rx="4" fill="#E7F6EE" stroke="#1F7F52" stroke-width="2"/>
<text x="356" y="1440" font-size="14" fill="#333">tools</text>
<rect x="415" y="1426" width="18" height="18" rx="4" fill="#F6F6F6" stroke="#7A7A7A" stroke-width="2"/>
<text x="441" y="1440" font-size="14" fill="#333">dados (SIMULADOS)</text>
