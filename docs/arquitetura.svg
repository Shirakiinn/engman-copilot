<path d="M610,400 V438" fill="none" stroke="#3B4A5A" stroke-width="2.4" marker-end="url(#a)"/>
<path d="M610,640 V678" fill="none" stroke="#3B4A5A" stroke-width="2.4" marker-end="url(#a)"/>
<path d="M610,808 V841" fill="none" stroke="#3B4A5A" stroke-width="2.4" marker-end="url(#a)"/>
<path d="M610,987 V1033" fill="none" stroke="#3B4A5A" stroke-width="2.4" marker-end="url(#a)"/>
<text x="622" y="1017" font-size="14" font-weight="700" fill="#3B4A5A" text-anchor="start">Não</text>
<path d="M610,1235 V1273" fill="none" stroke="#3B4A5A" stroke-width="2.4" marker-end="url(#a)"/>
<path d="M825,915 H948" fill="none" stroke="#3B4A5A" stroke-width="2.4" marker-end="url(#a)"/>
<text x="845" y="905" font-size="14" font-weight="700" fill="#3B4A5A" text-anchor="start">Sim</text>
<path d="M1210,838 V620 H862" fill="none" stroke="#3B4A5A" stroke-width="2.4" marker-end="url(#a)"/>
<text x="1198" y="700" font-size="14" font-weight="700" fill="#1F7F52" text-anchor="end">reinjeta o retorno no contexto</text>
<text x="1198" y="720" font-size="14" font-weight="700" fill="#1F7F52" text-anchor="end">→ nova chamada (máx. 3 por resposta)</text>
<path d="M950,512 H862" fill="none" stroke="#7A7A7A" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="905" y="540" font-size="13" font-weight="700" fill="#7A7A7A" text-anchor="middle">top-4</text>
<text x="905" y="557" font-size="13" font-weight="700" fill="#7A7A7A" text-anchor="middle">trechos</text>
<path d="M1210,1095 V1040" fill="none" stroke="#7A7A7A" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="1222" y="1072" font-size="14" font-weight="700" fill="#7A7A7A" text-anchor="start">lê / grava OS</text>
<path d="M360,320 H332" fill="none" stroke="#A83232" stroke-width="2.4" marker-end="url(#a)"/>
<path d="M50,385 V1339 H358" fill="none" stroke="#A83232" stroke-width="2.4" marker-end="url(#a)"/>
<path d="M330,525 H358" fill="none" stroke="#7A7A7A" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#a)"/>
<path d="M360,1305 H260 V602" fill="none" stroke="#7A7A7A" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="205" y="1000" font-size="14" font-weight="700" fill="#7A7A7A" text-anchor="start">grava</text>
